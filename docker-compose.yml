version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_password
      POSTGRES_DB: vertice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vertice.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql://postgres:super_password@db/vertice_db
      - API_TOKEN=vertice_qa_token_2026

  frontend:
    build: ./frontend
    container_name: frontend-1
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data: