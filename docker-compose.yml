services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_password # Cambia esto si lo deseas
      POSTGRES_DB: vertice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
      build: .
      ports:
        - "8000:8000"
      depends_on:
        - db
      restart: on-failure   # <--- LA MAGIA DE DEVOPS
      environment:
        - DATABASE_URL=postgresql://postgres:super_password@db/vertice_db

volumes:
  postgres_data: