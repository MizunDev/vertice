name: Integracion Continua VERTICE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pruebas-api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_database_only
          POSTGRES_DB: vertice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vertice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar API contra PostgreSQL desechable
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci_database_only@localhost:5432/vertice_test
        run: python -m pytest -q

  pruebas-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  prueba-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_PASSWORD: ci-disposable-smoke-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar configuración temporal
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import secrets
          from src.security import hash_password
          values = {
              'SECRET_KEY': secrets.token_hex(32),
              'ADMIN_USERNAME': 'smoke',
              'ADMIN_PASSWORD_HASH': hash_password(os.environ['SMOKE_PASSWORD']),
              'POSTGRES_PASSWORD': secrets.token_hex(24),
              'COOKIE_SECURE': 'false',
              'FRONTEND_PORT': '18080',
          }
          Path('.env').write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY
      - run: docker compose up --build -d
      - name: Probar login, cookie y API a través de NGINX
        run: |
          python - <<'PY'
          import http.cookiejar
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          base = 'http://localhost:18080'
          for attempt in range(30):
              try:
                  urllib.request.urlopen(base + '/api/partidos/', timeout=3)
              except urllib.error.HTTPError as error:
                  if error.code == 401:
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(1)
          else:
              raise RuntimeError('La API no arrancó detrás de NGINX')
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          login = urllib.request.Request(base + '/api/login', data=json.dumps({
              'username': 'smoke', 'password': os.environ['SMOKE_PASSWORD'],
          }).encode(), headers={'Content-Type': 'application/json'})
          response = opener.open(login)
          assert response.status == 200 and 'HttpOnly' in response.headers['Set-Cookie']
          assert isinstance(json.load(opener.open(base + '/api/partidos/')), list)
          assert json.load(opener.open(base + '/api/openapi.json'))['info']['title'] == 'VÉRTICE API'
          assert opener.open(base + '/').status == 200
          opener.open(urllib.request.Request(base + '/api/logout', data=b''))
          try:
              opener.open(base + '/api/partidos/')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('Logout no eliminó la cookie')
          print('Docker: login, catálogo, documentación, frontend y logout correctos.')
          PY
      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color api frontend
      - name: Limpiar solo el entorno desechable de CI
        if: always()
        run: docker compose down -v
